<!doctype html>
<html lang="ko" data-theme="dark">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>GoalComposer — preview</title>
<style>html,body{margin:0} body{background:var(--surface-100)} .pad{padding:var(--space-4)}</style></head>
<body>
<div class="mw-root pad">
<div class="mw-composer" style="max-width:560px">
<div class="mw-composer__ctx"><span class="mw-handle"><span class="mw-handle__kind">structure</span><span class="mw-handle__ref">#1 · 7XYZ <b>04be…7d</b></span></span><span class="mw-handle"><span class="mw-handle__kind">selection</span><span class="mw-handle__ref">pocket P1 · 14 res</span></span><button class="mw-btn mw-btn--sm mw-btn--ghost">+ 컨텍스트</button></div>
<textarea aria-label="목표" placeholder="무엇을 알고 싶은지 적으세요">P1 포켓 주변에서 리간드 결합을 약화시키지 않으면서 안정성을 올릴 점돌연변이 후보 3개를 찾아줘. 비싼 계산은 8회 이내.</textarea>
<div class="mw-composer__bar">
<span class="mw-select">pipeline: auto</span><span class="mw-select">budget: standard</span><span class="mw-select">egress: local_only</span>
<span style="flex:1"></span><span class="mw-muted mw-mono" style="font-size:12px">≈1.9k tok</span>
<button class="mw-btn">계획만</button><button class="mw-btn mw-btn--primary">▶ 실행 <span class="mw-kbd" style="color:inherit;border-color:currentColor">⌘↵</span></button>
</div></div>
</div>
</body>
</html>

# Tool contracts (plan §3.3, §5.2). The orchestrator enforces `accepts` BEFORE execution.
# Closed registry: new fixed durable methods are added only with reviewed protocols.
tools:
  # ---------------- L1 viewer (UI-side; executed by the frontend, logged as events) --------
  - name: snapshot
    level: L1
    emits: viewer_state
    read_only: true
    params: { label: { type: str } }
    description: 현재 뷰어 상태(카메라, 표현, 선택)를 viewer_state 핸들로 저장

  # ---------------- L2 structural ---------------------------------------------------------
  - name: load_structure
    level: L2
    version: 0.1.1  # chains_auth summary now lists unique author chain IDs
    emits: structure
    params:
      source: { type: str, required: true }          # internal local path; HTTP accepts only run upload IDs
      model_index: { type: int, default: 0, min: 0 }
    description: 검증된 로컬 업로드를 structure 핸들로 만든다. 원격 소스는 현재 지원하지 않는다.

  - name: prepare_structure
    level: L2
    accepts: { structure: [structure] }
    emits: prepared_structure
    params:
      altloc: { type: str, enum: [highest_occupancy, first], default: highest_occupancy }
      waters: { type: str, enum: [strip_all, keep_all], default: keep_all }
      hydrogens: { type: str, enum: [strip, keep], default: strip }
      missing_residues: { type: str, enum: [leave_gaps], default: leave_gaps }
      symmetry_mates: { type: str, enum: [ignore], default: ignore }
    description: 준비 결정을 전부 preparation_manifest로 기록하며 구조를 준비한다

  # Fixed asynchronous protein-only fpocket 4.2.3 lane (protocol fpocket_detect_v1); execution is JobQueue,
  # not Run.call. The engine and argv are fixed; top-k is a display setting, never a calculation argument.
  - name: detect_pockets
    level: L3
    version: '1'
    accepts: { structure: [prepared_structure, chemical_structure, openmm_minimized_structure] }
    emits: pocket_set
    cost_class: expensive
    typical_runtime_s: 30
    params:
      chains: { type: list, default: [] }                # chain_auth list; empty = every protein chain
    description: 선택한 단백질 체인의 표준 잔기 중원자만 고정 fpocket 4.2.3으로 검출한 공동 후보(결합 부위·친화도·druggability 증거 아님); durable_job lane

  # Fixed asynchronous M17 RDKit 2026.03.6 lane (protocols rdkit_inspect_v1 / rdkit_enumerate_v1); execution is
  # JobQueue, not Run.call. The worker module and interpreter are fixed by code; arguments are validated on admission.
  - name: rdkit_inspect_ligand
    level: L3
    version: '1'
    emits: ligand_inspection
    cost_class: expensive
    typical_runtime_s: 5
    description: 부모 리간드 SDF·building block·반응 규칙을 고정 RDKit 작업으로 점검한다(원자 표·번호 붙은 2D 그림·RDKit 추정 속성); durable_job lane

  - name: rdkit_enumerate_ligands
    level: L3
    version: '1'
    accepts: { inspection_handle: [ligand_inspection] }
    emits: ligand_candidate_set
    cost_class: expensive
    typical_runtime_s: 30
    description: 점검한 부모의 한 부위를 고정 교체·사용자 반응 규칙으로 바꾼 2D 후보와 RDKit 추정 속성·PAINS 구조 경고 일치를 만든다(친화도·약물 유사성 아님); durable_job lane

  # Fixed asynchronous M18 QuickVina 2.1 lane (protocol qvina_dock_v1); execution is JobQueue, not Run.call. The worker
  # module, interpreter and engine executable are fixed by code; arguments are validated on admission.
  - name: qvina_dock_ligand
    level: L3
    version: '1'
    emits: docking_result
    cost_class: expensive
    typical_runtime_s: 120
    description: 수용체·리간드 하나를 고정 QuickVina 2.1로 도킹(자유)하거나 코어 고정 샘플에 점수만 매긴다(qvina 점수, 친화도 아님; 기하 접촉 표); durable_job lane

  # Fixed asynchronous M19 batch lane (protocol qvina_batch_dock_v1): one job docks <= 50 M17 candidates (+ an optional
  # parent row) in order, each row being the M18 qvina_dock_v1 computation; execution is JobQueue, not Run.call.
  - name: qvina_dock_batch
    level: L3
    version: '1'
    emits: docking_batch_result
    cost_class: expensive
    typical_runtime_s: 1800
    description: 한 수용체·상자·seed·방식으로 M17 후보 여러 개(+선택 부모 행)를 차례로 고정 QuickVina 2.1 도킹하고 후보별 결과와 일괄 요약을 남긴다(qvina 점수, 친화도·순위 아님); durable_job lane

  # Fixed asynchronous M22 GA design lane (protocol qvina_ga_dock_v1): one job = one GA run over a published M17
  # candidate set; every evaluated individual is the M18 qvina_dock_v1 free computation; execution is JobQueue.
  - name: qvina_ga_design
    level: L3
    version: '1'
    emits: ligand_ga_result
    cost_class: expensive
    typical_runtime_s: 3600
    description: 게시된 M17 후보 집합 안에서 유전 알고리즘이 세대마다 도킹할 후보를 고르고 각 개체를 고정 QuickVina 2.1로 자유 도킹해 세대별 개체 표와 요약을 남긴다(qvina 점수, 친화도·순위·추천 아님); durable_job lane

  # Fixed asynchronous M23 sequence GA design lane (protocol sequence_ga_dock_v1): one job = one GA run over a published
  # M20 candidate set; every evaluated individual is a multi-mutation model (PDBFixer + OpenMM, modeling program child)
  # docked as the M18 qvina_dock_v1 free computation on that model; execution is JobQueue, not Run.call.
  - name: sequence_ga_design
    level: L3
    version: '1'
    emits: sequence_ga_result
    cost_class: expensive
    typical_runtime_s: 3600
    description: 게시된 M20 변이 후보 집합 안에서 유전 알고리즘이 세대마다 동시 변이 조합을 고르고 각 조합의 변이 구조를 PDBFixer + OpenMM으로 모델링한 뒤 사용자 SDF 리간드를 고정 QuickVina 2.1로 자유 도킹해 세대별 개체 표와 요약을 남긴다(qvina 점수, 친화도·순위·추천·변이 효과 아님); durable_job lane

  # Fixed asynchronous M21 lane (protocol openmm_mutation_model_v1); execution is JobQueue, not Run.call. One job = one
  # M20 candidate: the wild-type reference and the PDBFixer 1.12.0 mutant through the M7 OpenMM procedure. The worker
  # module and interpreter are fixed by code; arguments are validated on admission (mutation_model_bundle).
  - name: openmm_mutation_model
    level: L3
    version: '1'
    emits: mutation_model
    cost_class: expensive
    typical_runtime_s: 30
    description: M20 변이 후보 하나의 변이 구조를 PDBFixer 1.12.0으로 만들고 같은 절차의 야생형 기준 구조와 함께 OpenMM Amber14-all + GBn2로 최대 50회 최소화해 각 구조의 전위(kJ/mol)·변이 위치 SASA·주변 중원자 접촉을 남긴다(구조 간 차이·ΔΔG·안정성 아님); durable_job lane

  - name: compute_interactions
    level: L2
    accepts: { structure: [prepared_structure, relaxed_structure] }
    emits: interaction_set
    params:
      ligand: { type: dict }                             # explicit residue identity; omitted only if unique
      cutoff_A: { type: float, default: 4.0, min: 2.5, max: 6.0 }
      types: { type: list, enum: [contact, polar_contact, hydrophobic_contact],
               default: [contact, polar_contact, hydrophobic_contact] }
      engine: { type: str, enum: [geometric], default: geometric }
    description: 선택한 리간드 인스턴스와 단백질의 실제 중원자 거리만 측정한다

  - name: compute_interface_sasa
    level: L2
    version: '1'
    accepts: { structure: [prepared_structure] }
    emits: interface_sasa
    cost_class: moderate
    typical_runtime_s: 8
    params:
      ligand: { type: dict, required: true }
    description: 선택한 단백질과 단일 리간드의 FreeSASA Lee-Richards 100-slice 노출 및 매몰 면적을 Å²로 계산한다

  - name: measure
    level: L2
    accepts: { structure: [structure, prepared_structure, relaxed_structure] }
    emits: measurement
    read_only: true
    params:
      what: { type: str, enum: [distance, angle, rmsd, sasa], required: true }

  - name: measure_distance
    level: L2
    version: '1'
    accepts: { structure: [structure, prepared_structure, openmm_minimized_structure] }
    emits: atom_distance
    params:
      first: { type: dict, required: true }
      second: { type: dict, required: true }
    typical_runtime_s: 2
    description: 원본 좌표에서 동일 구조의 정확한 원자 두 개의 유클리드 거리를 Å로 측정한다

  - name: align_structures
    level: L2
    version: '1'
    accepts:
      reference: [structure, prepared_structure, openmm_minimized_structure]
      moving: [structure, prepared_structure, openmm_minimized_structure]
    emits: rigid_alignment
    params:
      pairs: { type: list, required: true }
    typical_runtime_s: 5
    description: 명시한 단백질 CA 쌍 3–1000개에 float64 고유 회전 Kabsch를 맞춘다

  # M15: SIFTS + local global alignment numbering against the pinned local reference snapshot set (no network).
  # A registry pre-check validates the whole input (reads the set and the structure) before the cache key.
  - name: map_residue_numbering
    level: L2
    version: '1'
    accepts: { structure: [structure, prepared_structure] }
    emits: residue_numbering_map
    cost_class: cheap
    typical_runtime_s: 2
    params:
      pdb_id: { default: null }                          # user-confirmed 4-char PDB ID (normalized upper case) | null
      chains: { type: list, required: true }             # [{chain_auth, uniprot_accession | null}], unique chain_auth
    description: 체인 잔기를 참조 스냅샷의 UniProt 위치·KLIFS 포켓 번호에 대응한다(SIFTS·로컬 전역 정렬, 두 방법이 같을 때만 대응됨; 값은 참조 스냅샷 값)

  # M16: fixed kinase key sites from one residue numbering map + optional geometric contacts of the same structure.
  # A registry pre-check validates both handles (null contacts allowed) before the generic argument check.
  - name: annotate_reference_sites
    level: L2
    version: '1'
    accepts: { numbering_map: [residue_numbering_map] }
    emits: reference_site_annotation
    cost_class: cheap
    typical_runtime_s: 1
    params:
      contacts: { default: null }                        # interaction_set handle of the same structure | null
    description: 번호 대응의 KLIFS 주요 부위(kinase_key_sites@1)를 부위별로 모으고 같은 구조의 기하 접촉 행을 붙인다(번호는 참조값, 접촉은 기하 거리)

  # M20: single-substitution candidate list over pocket / ligand-shell / user positions of one prepared structure.
  # A registry pre-check runs the closed admission checks (handles of this run, same structure) before the
  # generic argument check; it returns the normalized args (the call key). Reads only this run's stored objects.
  - name: generate_mutation_candidates
    level: L2
    version: '1'
    accepts: { structure: [prepared_structure] }
    emits: mutation_candidate_set
    cost_class: cheap
    typical_runtime_s: 2
    params:
      sources: { type: dict, required: true }           # {pocket: null | {pocket_set, ranks}, ligand_shell: null | {radius_A}, residues: [...]}
      ligand: { default: null }                          # ligand selector (7 identity fields) | null
      allowed_residues: { default: ACDEFGHIKLMNPQRSTVWY } # one-letter codes (string or list)
      protected_residues: { type: list, default: [] }
      released_residues: { type: list, default: [] }
      metal_contact_A: { type: float, default: 3.0 }
      numbering_map: { default: null }                   # residue_numbering_map handle of the same structure | null
      annotation: { default: null }                      # reference_site_annotation handle of the same structure | null
    description: 전처리 구조의 포켓 안쪽·리간드 주변·직접 고른 위치에서 보호 잔기(사용자 지정·KLIFS 주요 부위·금속 근접·이황화 Cys)를 이유와 함께 빼고 남은 위치마다 단일 아미노산 치환 후보 목록을 만든다(위치와 바꿀 잔기의 조합 목록이며 구조 모델링을 하지 않음)

  # M24: local projection only (no egress); the JEV send is a separate human-approved route.
  - name: build_jev_projection
    level: L2
    version: '1'
    accepts: { source: [ligand_candidate_set, mutation_candidate_set] }
    emits: jev_projection
    cost_class: cheap
    typical_runtime_s: 1
    params:
      candidates: { type: list, required: true }        # ligand: candidate ids "c_" + 16 hex | mutation: candidate indices; 1-20, no repeats
      filter: { default: null }                          # ligand only: M17 filter spec every chosen candidate passes | null
    description: 같은 run의 게시된 리간드·변이 후보 집합에서 고른 후보(1–20개)를 외부 모델에 보낼 수 있는 허용 목록 모양(별칭, 식별자, 저장된 값, 부위 주변 기하)과 정확한 요청 본문의 바이트 수·SHA-256으로 만들어 저장한다(이 도구는 아무것도 보내지 않으며 좌표·handle·번호 대응 값을 넣지 않음)

  - name: align
    level: L2
    accepts: { mobile: [structure, prepared_structure, relaxed_structure], reference: [structure, prepared_structure, relaxed_structure] }
    emits: alignment
    params: { method: { type: str, enum: [sequence_then_ca, ca_only], default: sequence_then_ca } }

  # Fixed asynchronous protein-only OpenMM lane; execution is JobQueue, not Run.call.
  - name: openmm_protein_minimize
    level: L3
    version: '1'
    accepts: { structure: [prepared_structure] }
    emits: openmm_minimization
    cost_class: expensive
    typical_runtime_s: 60
    params:
      selection_policy: { type: str, enum: [protein_only], required: true }
      hydrogen_policy: { type: str, enum: [rebuild_pH7], required: true }
    description: Fixed protein-only Amber14-all plus GBn2 potential and bounded minimization, kJ/mol; durable_job lane

  - name: prepare_chemical_structure
    level: L3
    version: '1'
    emits: chemical_graph
    cost_class: expensive
    typical_runtime_s: 120
    description: Fixed ProLIF prepared-chemistry conversion through the durable job lane only

  - name: compute_chemical_interactions
    level: L3
    version: '1'
    accepts: { graph_handle: [chemical_graph] }
    emits: chemical_interaction_set
    cost_class: expensive
    typical_runtime_s: 120
    params:
      schema: { type: str, enum: [chemical_detect_request@1], required: true }
      categories: { type: list, required: true }
    description: Fixed ProLIF fingerprint over one immutable chemical graph through the durable job lane only

  # ---------------- L3 energetic (PyRosetta, job queue, expensive) --------------------------
  - name: relax_structure
    level: L3
    accepts: { structure: [prepared_structure] }
    emits: relaxed_structure
    cost_class: expensive
    typical_runtime_s: 180
    params:
      scorefxn: { type: str, enum: [ref2015, ref2015_cart], default: ref2015_cart }
      nstruct: { type: int, default: 1, min: 1, max: 20 }
      constrain_to_start: { type: bool, default: true }

  - name: estimate_stability
    level: L3
    accepts: { structure: [relaxed_structure], mutations: [mutation_set] }
    emits: energy_table
    cost_class: expensive
    typical_runtime_s: 300
    params:
      protocol: { type: str, enum: [cartesian_ddg], default: cartesian_ddg }
      iterations: { type: int, default: 3, min: 1, max: 10 }

  - name: score_interface
    level: L3
    accepts: { structure: [prepared_structure, relaxed_structure] }
    emits: interface_scores
    cost_class: moderate
    params: { interface: { type: str, required: true } }     # e.g. "A_B"

  - name: residue_energies
    level: L3
    accepts: { structure: [relaxed_structure] }
    emits: residue_energy_table
    cost_class: moderate
    params: { scorefxn: { type: str, enum: [ref2015, ref2015_cart], default: ref2015_cart } }

  # ---------------- L4 state ---------------------------------------------------------------
  - name: define_mutations
    level: L4
    accepts: { structure: [prepared_structure, relaxed_structure] }
    emits: mutation_set
    params:
      mutations: { type: list, required: true }            # [{chain_auth, seq_auth, icode, to}]
    description: 사람이 칠한 design 마스크나 Frontier 제안을 mutation_set 핸들로 고정

  - name: compile_state
    level: L4
    accepts: { inputs: [structure, prepared_structure, relaxed_structure, pocket_set, interaction_set, energy_table, interface_scores] }
    handle_cardinality: { inputs: collection }
    emits: compact_state
    params: { token_budget: { type: int, default: 2000, min: 200, max: 8000 } }

  # ---------------- L5 workspace (what the agent sees by default) -------------------------
  - name: inspect_complex
    level: L5
    emits: compact_state
    params: { source: { type: str, required: true } }
    description: 파이프라인 pipelines/inspect_complex.yaml 을 결정론으로 실행

  - name: rank_candidates
    level: L5
    accepts: { table: [energy_table] }
    emits: ranking
    params: { strategy: { type: str, enum: [rule, jev], default: rule } }

[project]
name = "molecular-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "anyio>=4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "gemmi>=0.6",
  "freesasa==2.2.1",
  "openmm==8.6.0",
  "pyarrow>=15",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
secrets = ["keyring>=24"]
science = ["rdkit", "prolif", "plip", "MDAnalysis"]   # M1+; PyRosetta is installed separately (license)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
